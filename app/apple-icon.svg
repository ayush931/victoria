<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F241C"/>
      <stop offset="100%" stop-color="#060E0B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D79E"/>
      <stop offset="45%" stop-color="#D49B44"/>
      <stop offset="100%" stop-color="#A06E22"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96350"/>
      <stop offset="100%" stop-color="#8F392B"/>
    </linearGradient>
  </defs>

  <!-- Background Shield with Soft Luxury Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Portuguese Gable Archway (Ancestral Balcão Silhouette) -->
  <path d="M136 390 L136 250 Q256 130 376 250 L376 390" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Crown Jewel Diamond -->
  <polygon points="256,76 278,104 256,132 234,104" fill="url(#gold)"/>
  <circle cx="256" cy="104" r="5" fill="#FAF8F5"/>

  <!-- Main Monogram 'V' (Victorino Luxury Homes) -->
  <polygon points="152,180 236,180 262,364 246,364 168,198" fill="url(#gold)"/>
  <polygon points="252,364 336,180 360,180 264,384" fill="url(#gold)"/>
  <!-- Left Serif -->
  <rect x="144" y="176" width="76" height="12" rx="3" fill="url(#gold)"/>
  <!-- Right Serif -->
  <rect x="316" y="176" width="52" height="12" rx="3" fill="url(#gold)"/>

  <!-- Terracotta Goan Diamond Jewel in center -->
  <polygon points="256,236 266,252 256,268 246,252" fill="url(#terracotta)"/>

  <!-- Stepped Ancestral Plinth -->
  <line x1="160" y1="416" x2="352" y2="416" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <line x1="196" y1="434" x2="316" y2="434" stroke="url(#terracotta)" stroke-width="6" stroke-linecap="round"/>
</svg>
